# Builds cadsync on Windows, runs all tests, builds the installer, installs it,
# and checks the installed app really starts (window, UI, sync engine, SwRefs).
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # The runner has no SolidWorks, so SwRefs is built without the Document
      # Manager reader. It still starts and answers ping, which is what the
      # smoke test checks. Every Rust build on Windows needs this file.
      - name: Build SwRefs helper
        run: pnpm sidecar -AllowNoInterop

      - name: SwRefs tests
        run: dotnet test sidecar/SwRefs.Tests

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        run: |
          # SwRefs is already built above; skip rebuilding it (which would
          # require the SolidWorks interop DLL).
          $override = Join-Path $env:RUNNER_TEMP "ci.conf.json"
          '{"build":{"beforeBuildCommand":"pnpm build"}}' | Set-Content -Encoding utf8 $override
          pnpm tauri build --config $override

      - name: Install with the NSIS installer
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer was built" }
          Write-Host "Installing $($setup.Name)"
          $p = Start-Process $setup.FullName -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\cadsync", "$env:ProgramFiles\cadsync" -Filter cadsync.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "cadsync.exe not found after install" }
          $dir = Split-Path $exe.FullName
          Write-Host "Installed to $dir"
          Get-ChildItem $dir | Format-Table Name, Length
          if (-not (Test-Path (Join-Path $dir "SwRefs.exe"))) { throw "SwRefs.exe was not installed next to cadsync.exe" }
          "CADSYNC_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Start the installed app (smoke test)
        run: |
          $result = Join-Path $env:RUNNER_TEMP "smoke.json"
          $shot = Join-Path $env:RUNNER_TEMP "cadsync-windows.png"
          $env:CADSYNC_SMOKE = $result
          $env:CADSYNC_SMOKE_HOLD_SECS = "12"
          $p = Start-Process $env:CADSYNC_EXE -PassThru
          $null = $p.Handle  # keep a handle so ExitCode is available later

          Start-Sleep -Seconds 8
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($shot, [System.Drawing.Imaging.ImageFormat]::Png)
          } catch { Write-Warning "screenshot failed: $_" }

          if (-not $p.WaitForExit(180000)) {
            $p.Kill()
            throw "cadsync didn't exit within 3 minutes"
          }
          if (Test-Path $result) { Get-Content $result } else { Write-Warning "no result file written" }
          if ($p.ExitCode -ne 0) { throw "smoke test failed (exit code $($p.ExitCode))" }
          Write-Host "cadsync started and passed the smoke test on Windows."

      - name: Upload smoke test result and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: |
            ${{ runner.temp }}/smoke.json
            ${{ runner.temp }}/cadsync-windows.png
          if-no-files-found: ignore

      - name: Upload installers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cadsync-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
